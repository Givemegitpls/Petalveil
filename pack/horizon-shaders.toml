[[options]]
id = "water_clarity"
name = "Water clarity"
description = "How far you see into water."
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waving"
name = "Waving plants"
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Wind"
type = "float"
default = 1.0
min = 0.0
max = 2.5
step = 0.1

[[options]]
id = "sky_pastel"
name = "Pastel sky"
description = "How much of the sky takes the pack's soft lilac and peach. 0 keeps vanilla's colours."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "rainbow"
