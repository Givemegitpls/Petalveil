default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_edges"
name = "Cloud edge blur"
description = "Radius, in pixels, of the blur on vanilla's cloud rims. Higher is softer. Only the clouds are affected; 5 is the pack's default, 0 turns it off."
type = "float"
default = 10.0
min = 0.0
max = 64.0
step = 1.0

[[options]]
id = "volumetric_fog"
name = "Volumetric fog"
description = "Fog lit by the sun through the shadows: shafts of light in a forest or a valley. Off by default; it is the costliest option in the pack."
type = "bool"
default = false

[[options]]
id = "fog_density"
name = "Fog thickness"
description = "How thick the air is. Vanilla's own fog stays on either way."
type = "float"
default = 1
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "fog_height"
name = "Fog height"
description = "How tall the ground layer is before the fog thins out, in blocks."
type = "float"
default = 42.0
min = 4.0
max = 64.0
