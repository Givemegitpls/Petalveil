[[options]]
id = "shadows"
name = "Shadows"
description = "Sun and moon shadows. They only shade the light that comes from the sky, so caves and night are untouched. Off saves the most GPU time."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow detail"
description = "The shadow map's size in texels."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far from you, in blocks, things cast shadows. 128 is eight chunks."
type = "choice"
values = ["64", "96", "128", "160"]
default = "128"

[[options]]
id = "shadow_softness"
name = "Shadow edges"
description = "Sharp reads the shadow map once, soft four times and very soft nine times."
type = "choice"
values = ["Sharp", "Soft", "Very soft"]
default = "Soft"

[[options]]
id = "shadow_strength"
name = "Shadow depth"
description = "How dark a shadow is. 1.6 is the pack's default, above it the shade deepens, 0 makes shadows invisible but still turns off the sun's light in them."
type = "float"
default = 1.6
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "cloud_shadows"
name = "Cloud shadows"
description = "Broad patches of shade drifting over the land as clouds pass the light. The pattern is the pack's own, so it does not line up with the clouds in the sky; 0 turns it off."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_shadow_size"
name = "Cloud shadow size"
description = "Patch size: 0.02 is a fine broken sky, 0.35 is the pack's own, 1 stretches one shadow over a whole hillside."
type = "float"
default = 0.27
min = 0.02
max = 1.0
step = 0.01

[[options]]
id = "cloud_shadow_cover"
name = "Cloud shadow cover"
description = "How much of the sky is shaded: 0 is a few sparse patches, 1 is nearly overcast."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How much the sun adds on top of vanilla's light. 0 leaves vanilla's brightness alone."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "moon_shadows"
name = "Moon shadows"
description = "Shadows cast by the moon at night. Off keeps the night flat, as vanilla has it."
type = "bool"
default = true

[[options]]
id = "moon_shadow_strength"
name = "Moon shadow depth"
description = "How dark a moon shadow is. The sun's own depth is Shadow depth; this one applies at night."
type = "float"
default = 0.6
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "colored_light"
name = "Coloured light"
description = "A hue shift on block light: torches warmer, soul fire blue. Brightness stays vanilla's."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Reflections"
description = "Water mirrors the world. Turning them off saves a half-resolution pass of the terrain."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Waves"
type = "bool"
default = true

[[options]]
id = "wave_size"
name = "Wave height"
description = "The swell's height and its tilt, from 0 (flat) to 1 (a visible chop). The length is a separate slider; the fine detail is Ripples."
type = "float"
default = 0.68
min = 0.0
max = 1.0
step = 0.01

[[options]]
id = "water_texture"
name = "Water texture"
description = "Vanilla's scrolling water sprite. Off, the surface is the biome's flat colour, and the pack's waves and reflections are the only detail on it."
type = "bool"
default = false

[[options]]
id = "wave_length"
name = "Wave length"
description = "How long the swell is: 0.25 is a short chop, 1 is the pack's own, 4 stretches one wave over several blocks."
type = "float"
default = 2
min = 0.25
max = 4.0
step = 0.05

[[options]]
id = "wave_speed"
name = "Wave speed"
description = "How fast the swell travels and rolls. 0 freezes the surface."
type = "float"
default = 3.0
min = 0.0
max = 9.0
step = 0.1

[[options]]
id = "ripples"
name = "Ripples"
description = "The fine chop on the surface. Off hides it whatever its height below."
type = "bool"
default = true

[[options]]
id = "water_ripples"
name = "Ripple height"
description = "The fine chop's strength on the surface and in the refraction: 0 is glassy, 2 is lively. Its wavelength is the next slider."
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ripple_length"
name = "Ripple length"
description = "The fine chop's wavelength: 0.25 is a tight shimmer, 1 is the pack's own, 4 stretches it into wide soft ripples."
type = "float"
default = 1.2
min = 0.25
max = 4.0
step = 0.05

[[options]]
id = "ripple_speed"
name = "Ripple speed"
description = "How fast the fine chop drifts. 0 freezes it, independent of the swell's speed."
type = "float"
default = 4.0
min = 0.0
max = 9.0
step = 0.1

[[options]]
id = "rain_ripples"
name = "Rain rings"
description = "The pack's own rings on wet water. The game draws its own as rain particles: to drop those, set Options > Video Settings > Particles to Minimal (the rain sound stays)."
type = "bool"
default = false

[[options]]
id = "ring_strength"
name = "Rings strength"
description = "How strong the pack's rain rings are: bright crests and how much they bend the bed. Only with Rain rings set to the pack's own."
type = "float"
default = 1.4
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "ring_size"
name = "Rings size"
description = "The distance between rings: higher spreads them over more blocks."
type = "float"
default = 1.0
min = 0.4
max = 4.0
step = 0.05

[[options]]
id = "ring_lines"
name = "Rings thickness"
description = "How wide one ring is: below 1 they are thin hairlines, above they soften into wide ripples."
type = "float"
default = 1.0
min = 0.4
max = 2.5
step = 0.05

[[options]]
id = "ring_speed"
name = "Rings speed"
description = "How fast the rings spread and fade. 0 freezes them."
type = "float"
default = 2.4
min = 0.0
max = 9.0
step = 0.1

[[options]]
id = "water_saturation"
name = "Water saturation"
description = "How blue the water is: 0 is grey, 1 keeps vanilla's biome tint, 2 is vivid. Swamp water is already green in vanilla."
type = "float"
default = 0.45
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "water_hue"
name = "Water hue"
description = "Turns the water's hue around the grey axis, in degrees: negative goes toward green, positive toward violet."
type = "float"
default = 0.0
min = -180.0
max = 180.0
step = 5.0

[[options]]
id = "glints"
name = "Sun glitter"
description = "Sparkles of sunlight on the surface. Off hides them whatever their strength below."
type = "bool"
default = true

[[options]]
id = "water_glints"
name = "Sun glitter"
description = "Small sparkles of sunlight on the surface, on top of the broad glint. 0 leaves only the smooth highlight."
type = "float"
default = 0.1
min = 0.0
max = 4.0
step = 0.05

[[options]]
id = "glint_size"
name = "Glitter size"
description = "How big one sparkle is: 10 is the pack's own look, higher gives bigger and sparser glitter, lower a fine sand."
type = "float"
default = 9.5
min = 2.0
max = 40.0
step = 0.5

[[options]]
id = "glint_speed"
name = "Glitter speed"
description = "How fast the sparkles drift and flicker. 0 freezes them."
type = "float"
default = 1.0
min = 0.0
max = 9.0
step = 0.1

[[options]]
id = "glint_lines"
name = "Glitter lines"
description = "The core the spark is cut from: smaller is finer and sparser, and it sets where the fade starts."
type = "float"
default = 0.1
min = 0.02
max = 0.3
step = 0.01

[[options]]
id = "glint_blur"
name = "Glitter blur"
description = "How wide the fade from a bright spark to the dark water is: 0 is a crisp pinprick, 3 melts the sparks into a soft glow. The same meaning as Caustics blur."
type = "float"
default = 2.7
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "caustics"
name = "Caustics"
description = "The bright net the sun draws on the bed under moving water. Off hides it whatever its strength below."
type = "bool"
default = true

[[options]]
id = "water_caustics"
name = "Caustics"
description = "The bright net the sun draws on the bed under moving water: strongest in the shallows, gone in the deep and at night. 0 turns it off."
type = "float"
default = 0.65
min = 0.0
max = 4.0
step = 0.05

[[options]]
id = "caustic_speed"
name = "Caustics speed"
description = "How fast the net on the bed crawls. 0 freezes it."
type = "float"
default = 2.0
min = 0.0
max = 9.0
step = 0.1

[[options]]
id = "caustic_fade"
name = "Caustics depth fade"
description = "How fast caustics die with depth: 0 keeps them to any depth, 1 is the pack's own, 3 confines them to the shallows."
type = "float"
default = 0.95
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "caustic_blur"
name = "Caustics blur"
description = "How wide the fade from a bright strand to the dark bed is: 0 is a crisp web, 3 melts it into a soft glow. Costs nothing extra."
type = "float"
default = 0.5
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "caustic_size"
name = "Caustics size"
description = "The net's cell size: higher is a bigger, wider mesh, lower is a fine dense one."
type = "float"
default = 1.0
min = 0.25
max = 4.0
step = 0.05

[[options]]
id = "caustic_lines"
name = "Caustics lines"
description = "How thick the bright strands are: smaller is a thinner, sharper web."
type = "float"
default = 0.2
min = 0.04
max = 0.5
step = 0.02

[[options]]
id = "water_opacity"
name = "Water opacity"
description = "How much of what lies behind the water shows, seen from the surface. 1 keeps vanilla's own alpha, 0 leaves only the reflection."
type = "float"
default = 0.75
min = 0.0
max = 1.0
