step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.8
max = 1.2
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.03
