schema = 1
id = "petalveil"
name = "Petalveil"
version = "0.22.0"
api = "0.1"
description = "Vanilla's own light kept as the base: sun shadows only touch the light from the sky, so caves, torchlight and night stay vanilla-bright. On top of that a pastel sky, rounded cubic clouds, waves and reflections on water, plants in the wind, and a soft glow."
authors = ["BarmaleyVIP"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"
# Vanilla's clouds stay: they are geometry in the world, so they hide the sun and move against the
# ground when you walk. The sun is the pack's own, drawn as a pixel circle on the screen's grid.
sun = false


[material]
file = "material.wgsl"
files = ["lighting.wgsl", "water.wgsl"]
name = "Terrain light and water"

[vertex]
file = "vertex.wgsl"
name = "Wind and waves"

# The shadow pass draws the terrain in the light's square again, so its cost grows with distance squared.
[shadow]
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"
resolution = 2048
distance = 128.0
# Leaves cast whole shadows, whatever holes their texture has.
solid_materials = [1]

[reflection]
option = "reflections"

[[post]]
file = "post/glow_prefilter.wgsl"
name = "Glow prefilter"
output = "petal_glow_a"
scale = 0.25

[[post]]
file = "post/glow_blur.wgsl"
name = "Glow blur"
output = "petal_glow_b"
scale = 0.25

[[post]]
file = "post/volumetric.wgsl"
name = "Volumetric fog"
output = "petal_fog"
scale = 0.25

[[post]]
file = "post/rays.wgsl"
name = "Sun rays"
output = "petal_rays"
scale = 0.25

[[post]]
file = "post/composite.wgsl"
name = "Composite and grade"

[budget]
gpu_ms = 3.0

# --- Materials: MaterialInput.material and VertexInput.material (ids in common.wgsl) ---

[[tags]]
id = "water_flow"
sprites = ["block/water_flow"]

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = [
  "block/short_grass", "block/short_dry_grass", "block/tall_dry_grass", "block/fern", "block/bush",
  "block/dead_bush", "block/firefly_bush", "block/*_sapling", "block/dandelion", "block/poppy",
  "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy",
  "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower",
  "block/closed_eyeblossom", "block/open_eyeblossom", "block/wheat_stage*", "block/carrots_stage*",
  "block/potatoes_stage*", "block/beetroots_stage*", "block/sweet_berry_bush_stage*",
]

[[materials]]
id = 3
sprites = [
  "block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom",
  "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom",
]

[[materials]]
id = 4
sprites = [
  "block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/sunflower_front",
  "block/sunflower_back", "block/lilac_top", "block/rose_bush_top", "block/peony_top",
  "block/pitcher_plant_top",
]

[[materials]]
id = 5
sprites = ["block/vine", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*"]

# --- Coloured block light: only a hue shift, and only while the option is up from 0 ---

[[lights]]
color = [1.0, 0.72, 0.42]
blocks = ["torch", "wall_torch", "lantern", "campfire", "fire", "jack_o_lantern", "*candle*", "furnace", "smoker", "blast_furnace"]

[[lights]]
color = [0.35, 0.78, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.3, 0.18]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp"]

[[lights]]
color = [1.0, 0.85, 0.55]
blocks = ["glowstone", "shroomlight", "ochre_froglight"]

[[lights]]
color = [0.62, 0.92, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.78, 0.48, 1.0]
blocks = ["amethyst_cluster", "*_amethyst_bud", "crying_obsidian", "nether_portal", "respawn_anchor"]

# --- Options: each one a WGSL `override` of the same name ---

[[pages]]
id = "main"
name = "Petalveil"
items = ["page:lighting", "page:water", "page:nature", "page:sky", "page:fog", "page:camera", ""]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Shadows and how much the sun adds to vanilla's own light."
items = ["shadows", "shadow_softness", "shadow_resolution", "shadow_distance", "shadow_strength", "sun_strength", "colored_light", ""]

[[pages]]
id = "water"
name = "Water"
description = "Reflections, waves and how far you see into water."
items = ["reflections", "water_waves", "water_clarity", ""]

[[pages]]
id = "nature"
name = "Nature"
description = "Leaves and plants in the wind."
items = ["waving", "wave_strength", ""]

[[pages]]
id = "sky"
name = "Sky"
description = "The sky's pastel tint, the sun's size, the rainbow after rain and the night."
items = ["sky_pastel", "sun", "sun_pixels", "sun_scale", "sun_blur", "cloud_edges", "rainbow", "night_mood", ""]

[[pages]]
id = "fog"
name = "Fog"
description = "Volumetric fog: light shafts in forests and valleys, and how thick the air is."
items = ["volumetric_fog", "fog_density", "fog_height", "fog_steps", ""]

[[pages]]
id = "camera"
name = "Camera"
description = "Edge smoothing, glow, sun rays and the colour grade."
items = ["bloom", "sun_rays", "exposure", "contrast", "saturation", "vignette", "dither"]

[[options]]
id = "shadows"
name = "Shadows"
description = "Sun and moon shadows. They only shade the light that comes from the sky, so caves and night are untouched. Off saves the most GPU time."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow detail"
description = "The shadow map's size in texels."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far from you, in blocks, things cast shadows. 128 is eight chunks."
type = "choice"
values = ["64", "96", "128", "160"]
default = "128"

[[options]]
id = "shadow_softness"
name = "Shadow edges"
description = "Sharp reads the shadow map once, soft four times and very soft nine times."
type = "choice"
values = ["Sharp", "Soft", "Very soft"]
default = "Soft"

[[options]]
id = "shadow_strength"
name = "Shadow depth"
description = "How dark a shadow is. 1.6 is the pack's default, above it the shade deepens, 0 makes shadows invisible but still turns off the sun's light in them."
type = "float"
default = 1.6
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How much the sun adds on top of vanilla's light. 0 leaves vanilla's brightness alone."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "colored_light"
name = "Coloured light"
description = "A hue shift on block light: torches warmer, soul fire blue. Brightness stays vanilla's."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Reflections"
description = "Water mirrors the world. Turning them off saves a half-resolution pass of the terrain."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Waves"
type = "bool"
default = true

[[options]]
id = "water_clarity"
name = "Water clarity"
description = "How far you see into water."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waving"
name = "Waving plants"
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Wind"
type = "float"
default = 1.0
min = 0.0
max = 2.5
step = 0.1

[[options]]
id = "sky_pastel"
name = "Pastel sky"
description = "How much of the sky takes the pack's soft lilac and peach. 0 keeps vanilla's colours."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sun"
name = "Sun"
description = "The pack's own sun. Vanilla's is replaced by it, so off leaves the sky without a disc; the sunlight on the world stays."
type = "bool"
default = true

[[options]]
id = "sun_pixels"
name = "Sun pixels"
description = "How many cells across the sun's circle: fewer means chunkier pixels. Its size on screen stays vanilla's."
type = "choice"
values = ["8", "16", "24", "32", "48"]
default = "16"

[[options]]
id = "sun_scale"
name = "Sun size"
description = "The sun's size against vanilla's quad: 0.25 (the default) is about 8 degrees across and reads like vanilla's own, 1 is the quad's full 33 degrees."
type = "float"
default = 0.25
min = 0.1
max = 1.2
step = 0.05

[[options]]
id = "sun_blur"
name = "Sun blur"
description = "Radius, in pixels, of a blur on the sun alone, so its pixel rim turns into a glow. 14 is the pack's default; 0 keeps the hard edge."
type = "float"
default = 14.0
min = 0.0
max = 24.0
step = 1.0

[[options]]
id = "rainbow"
name = "Rainbow"
description = "A rainbow opposite the sun while the rain dries."
type = "bool"
default = true

[[options]]
id = "night_mood"
name = "Night mood"
description = "A cooler night sky and moonlight, with vanilla's brightness kept. 0 leaves the night alone."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_edges"
name = "Cloud edge blur"
description = "Radius, in pixels, of the blur on vanilla's cloud rims. Higher is softer. Only the clouds are affected; 5 is the pack's default, 0 turns it off."
type = "float"
default = 5.0
min = 0.0
max = 32.0
step = 1.0

[[options]]
id = "volumetric_fog"
name = "Volumetric fog"
description = "Fog lit by the sun through the shadows: shafts of light in a forest or a valley. Off by default; it is the costliest option in the pack."
type = "bool"
default = false

[[options]]
id = "fog_density"
name = "Fog thickness"
description = "How thick the air is. Vanilla's own fog stays on either way."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "fog_height"
name = "Fog height"
description = "How tall the ground layer is before the fog thins out, in blocks."
type = "float"
default = 24.0
min = 4.0
max = 64.0
step = 2.0

[[options]]
id = "fog_steps"
name = "Fog detail"
description = "Steps of the march. 8 is cheap and reads the same in motion; 16 is for still screenshots."
type = "choice"
values = ["8", "16"]
default = "8"

[[options]]
id = "bloom"
name = "Glow"
description = "A soft glow around bright things."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sun_rays"
name = "Sun rays"
description = "Light spilling from the sun at sunrise and sunset."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.8
max = 1.2
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.03
min = 0.9
max = 1.2
step = 0.01

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.06
min = 0.8
max = 1.4
step = 0.02

[[options]]
id = "dither"
name = "Dither"
description = "Half a step of noise that breaks banding in smooth gradients. Off, a sky gradient may band on an 8-bit screen; on, it is a barely visible film grain."
type = "bool"
default = true

[[options]]
id = "vignette"
name = "Vignette"
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05
